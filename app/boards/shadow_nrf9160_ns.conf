# LIS2DTW12 accelerometer + temperature sensor on SPI2
# Temperature is read by the motion module instead of the environmental (BME680) module
# Zephyr lis2dw12 driver handles basic init from DTS properties
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_LIS2DW12=y
CONFIG_LIS2DW12_TRIGGER_GLOBAL_THREAD=y
CONFIG_LIS2DW12_WAKEUP=y
CONFIG_APP_MOTION=y
CONFIG_APP_ENVIRONMENTAL=n

# LED module (PWM LEDs)
CONFIG_APP_LED=y

CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
# Place RTT control block in the dedicated SRAM_RTT region at 0x2000c568
CONFIG_SEGGER_RTT_SECTION_CUSTOM_DTS_REGION=y

# No MCUboot — direct boot from flash
CONFIG_BOOTLOADER_MCUBOOT=n

# App (non-secure) runs from slot0_ns_partition
CONFIG_FLASH_LOAD_OFFSET=0x10000
CONFIG_FLASH_LOAD_SIZE=0xee000

# TODO: verify if this is true
# Silence TF-M logging so it doesn't need a UART (saves power)
CONFIG_TFM_LOG_LEVEL_SILENCE=y

CONFIG_APP_SAMPLING_INTERVAL_SECONDS=300

# Configure COEX0 for GNSS/LTE coexistence
# GNSS antenna is shared with LTE, LNA EN connected to COEX0
# Modem antenna library sends AT%XCOEX0 automatically after modem init
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_GNSS_ONBOARD=y
CONFIG_MODEM_ANTENNA_AT_COEX0="AT%XCOEX0=1,1,1570,1580"
