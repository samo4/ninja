# Environmental module (BME680 on I2C2)
CONFIG_APP_ENVIRONMENTAL=y
CONFIG_BME680=y
CONFIG_SENSOR=y

# LED module (RGB LED via PWM)
CONFIG_APP_LED=y

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
# RTT console and shell via J-Link (instead of UART/nRF52840 bridge)
CONFIG_SHELL_BACKEND_RTT=y
# Place RTT control block in the dedicated SRAM_RTT region at 0x2000c568
# (locked address — avoids J-Link auto-detection failures on nRF91)
CONFIG_SEGGER_RTT_SECTION_CUSTOM_DTS_REGION=y

# No MCUboot — direct boot from flash
CONFIG_BOOTLOADER_MCUBOOT=n

# App (non-secure) runs from slot0_ns_partition: see boards overlay for layout
CONFIG_FLASH_LOAD_OFFSET=0x10000
CONFIG_FLASH_LOAD_SIZE=0xee000

CONFIG_APP_SAMPLING_INTERVAL_SECONDS=1800

